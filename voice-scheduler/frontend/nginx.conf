server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location /auth/ {
        proxy_pass https://aimeetingscheduler-backend-production.up.railway.app;
        proxy_set_header Host aimeetingscheduler-backend-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_server_name on;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain aimeetingscheduler-backend-production.up.railway.app aimeetingscheduler-production.up.railway.app;
    }
    
    location /api/ {
        proxy_pass https://aimeetingscheduler-backend-production.up.railway.app;
        proxy_set_header Host aimeetingscheduler-backend-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_server_name on;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain aimeetingscheduler-backend-production.up.railway.app aimeetingscheduler-production.up.railway.app;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
